        function App() {
            const [lang, setLang] = React.useState('es');
            const t = translations[lang];

            const [currentUser, setCurrentUser] = React.useState(null);
            const [currentUid, setCurrentUid] = React.useState(null);
            const [currentEmail, setCurrentEmail] = React.useState('');
            const [authLoading, setAuthLoading] = React.useState(true);
            const [isActionLoading, setIsActionLoading] = React.useState(false);

            const [viewMode, setViewMode] = React.useState('login'); 
            const [inputName, setInputName] = React.useState('');
            const [inputEmail, setInputEmail] = React.useState('');
            const [inputPassword, setInputPassword] = React.useState('');
            const [maskedEmail, setMaskedEmail] = React.useState('');

            const [isMenuOpen, setIsMenuOpen] = React.useState(false);
            const [isFilesOpen, setIsFilesOpen] = React.useState(false);
            const [expandedYear, setExpandedYear] = React.useState('2026');
            const [isDragging, setIsDragging] = React.useState(false);
            
            const [pendingFileContent, setPendingFileContent] = React.useState(null);
            const [selectedModalYear, setSelectedModalYear] = React.useState('2026');
            
            const [allTrips, setAllTrips] = React.useState([]);
            const [uploadedFiles, setUploadedFiles] = React.useState([]);
            const [selectedPeriod, setSelectedPeriod] = React.useState('09-2026');

            // Constantes financieras globales
            const basePay = 1916.58;
            const fixedAllowance = 80.27;
            const singaporeAllowancePerTrip = 421.32; 
            const perthAllowancePerTrip = 239.12;
            const holidayRatePerDay = 17.39; 

            const getTripDuration = (trip) => {
                if (trip.holiday) return trip.count || 1;
                if (trip.type === 'perth') return 6;
                return 4; 
            };

            const getTripEndDate = (trip) => {
                const startDate = new Date(trip.year, trip.month - 1, trip.day);
                const durationDays = getTripDuration(trip);
                const endDate = new Date(startDate);
                endDate.setDate(endDate.getDate() + (durationDays - 1));
                return endDate;
            };

            React.useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.firebaseAppInstances) {
                        clearInterval(checkInterval);
                        const { auth, onAuthStateChanged, db, doc, getDoc } = window.firebaseAppInstances;
                        
                        onAuthStateChanged(auth, async (user) => {
                            if (user) {
                                setCurrentUid(user.uid);
                                setCurrentEmail(user.email);
                                let name = user.displayName;
                                if (!name && db && doc && getDoc) {
                                    try {
                                        const userDoc = await getDoc(doc(db, "users", user.uid));
                                        if (userDoc.exists()) {
                                            name = userDoc.data().name;
                                        }
                                    } catch (e) {
                                        console.error(e);
                                    }
                                }
                                setCurrentUser(name || user.email.split('@')[0]);
                            } else {
                                setCurrentUser(null);
                                setCurrentUid(null);
                                setCurrentEmail('');
                            }
                            setAuthLoading(false);
                        });
                    }
                }, 100);
            }, []);

            React.useEffect(() => {
                if (!currentUid || !window.firebaseAppInstances) return;
                const { db, doc, onSnapshot } = window.firebaseAppInstances;

                const unsubscribe = onSnapshot(doc(db, "crew_data", currentUid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.trips) setAllTrips(data.trips);
                        if (data.files) setUploadedFiles(data.files);
                    }
                });

                return () => unsubscribe();
            }, [currentUid]);

            const saveDataToCloud = async (newTrips, newFiles) => {
                if (!currentUid || !window.firebaseAppInstances) return;
                const { db, doc, setDoc } = window.firebaseAppInstances;
                try {
                    await setDoc(doc(db, "crew_data", currentUid), {
                        trips: newTrips,
                        files: newFiles
                    }, { merge: true });
                } catch (e) {
                    console.error("Error guardando datos:", e);
                }
            };

            const parseFileToTrips = (text, targetYear, fileToken) => {
                const lines = text.split(/\r?\n/);
                let rawDutyList = [];

                lines.forEach(line => {
                    if (line.includes('|') && line.match(/\b\d{2}\/\d{2}\b/)) {
                        const columns = line.split('|');
                        columns.forEach(col => {
                            const trimmedCol = col.trim();
                            const matchPattern = trimmedCol.match(/(\d{2})\/(\d{2})\s+[A-Z]?\s*(SIL\d+|PRL[A-Z0-9]*|QF\d+|SBY|SR|AL)/);
                            if (matchPattern) {
                                let day = parseInt(matchPattern[1], 10);
                                let month = parseInt(matchPattern[2], 10);

                                rawDutyList.push({
                                    day,
                                    month,
                                    year: targetYear,
                                    dateStr: `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${targetYear}`,
                                    duty: matchPattern[3]
                                });
                            }
                        });
                    }
                });

                if (rawDutyList.length === 0) return { rawDutyList: [], trips: [] };

                rawDutyList.sort((a, b) => (a.month !== b.month ? a.month - b.month : a.day - b.day));

                const newProcessedTrips = [];
                let currentHolidayBlock = null;
                let currentSbyBlock = null;

                rawDutyList.forEach(item => {
                    const isSby = item.duty === 'SBY' || item.duty === 'SR';
                    const isAL = item.duty === 'AL';

                    if (currentSbyBlock && !isSby) {
                        newProcessedTrips.push({ ...currentSbyBlock, fileToken });
                        currentSbyBlock = null;
                    }

                    if (currentHolidayBlock && !isAL) {
                        newProcessedTrips.push({ ...currentHolidayBlock, fileToken });
                        currentHolidayBlock = null;
                    }

                    if (isAL) {
                        if (!currentHolidayBlock) {
                            currentHolidayBlock = {
                                id: Date.now() + Math.random(),
                                day: item.day,
                                month: item.month,
                                year: item.year,
                                dateStr: item.dateStr,
                                duty: lang === 'es' ? 'Vacaciones (AL)' : 'Holiday (AL)',
                                type: 'holiday',
                                count: 1,
                                delay16h: false,
                                delaySectorsCount: 1,
                                holiday: true,
                                calledOut: false
                            };
                        } else {
                            currentHolidayBlock.count += 1;
                        }
                    } else if (isSby) {
                        if (!currentSbyBlock) {
                            currentSbyBlock = {
                                id: Date.now() + Math.random(),
                                day: item.day,
                                month: item.month,
                                year: item.year,
                                dateStr: item.dateStr,
                                duty: 'Bloque SBY (Standby)',
                                dutyBase: 'SBY',
                                type: 'sby',
                                count: 1,
                                delay16h: false,
                                delaySectorsCount: 1,
                                holiday: false,
                                calledOut: false,
                                callType: 'singapore'
                            };
                        } else {
                            currentSbyBlock.count += 1;
                        }
                    } else {
                        const isPerth = item.duty.startsWith('PRL') || item.duty === 'QF10' || item.duty === 'QF209';
                        const duration = isPerth ? 6 : 4;

                        // Agrupación de trips: evita crear un trip duplicado si la fecha del ítem cae dentro del rango de un viaje ya existente
                        const isOverlapping = (tripList) => tripList.some(t => {
                            if (t.holiday) return false;
                            const tStart = new Date(t.year, t.month - 1, t.day).getTime();
                            const tEnd = getTripEndDate(t).getTime();
                            const itemTime = new Date(item.year, item.month - 1, item.day).getTime();
                            return itemTime >= tStart && itemTime <= tEnd;
                        });

                        if (!isOverlapping(newProcessedTrips)) {
                            newProcessedTrips.push({
                                id: Date.now() + Math.random(),
                                day: item.day,
                                month: item.month,
                                year: item.year,
                                dateStr: item.dateStr,
                                duty: item.duty.substring(0, 5),
                                dutyBase: item.duty,
                                type: isPerth ? 'perth' : 'singapore',
                                count: duration,
                                delay16h: false,
                                delaySectorsCount: 1,
                                holiday: false,
                                calledOut: false,
                                fileToken
                            });
                        }
                    }
                });

                if (currentHolidayBlock) newProcessedTrips.push({ ...currentHolidayBlock, fileToken });
                if (currentSbyBlock) newProcessedTrips.push({ ...currentSbyBlock, fileToken });

                return { rawDutyList, trips: newProcessedTrips };
            };

            const confirmAndProcessRoster = (targetYear) => {
                const text = pendingFileContent;
                setPendingFileContent(null);
                if (!text || !text.trim()) return;

                const fileToken = `roster_${Date.now()}`;
                const { rawDutyList, trips: newProcessedTrips } = parseFileToTrips(text, targetYear, fileToken);

                if (rawDutyList.length === 0) {
                    alert(lang === 'es' ? 'No se pudieron leer los vuelos o turnos del archivo.' : 'Could not read flights or duties from file.');
                    return;
                }

                const firstItem = rawDutyList[0];
                const lastItem = rawDutyList[rawDutyList.length - 1];

                const firstMonthName = t.monthsShort[firstItem.month - 1];
                const lastMonthName = t.monthsShort[lastItem.month - 1];
                const generatedFileName = `Roster ${firstItem.day} ${firstMonthName} - ${lastItem.day} ${lastMonthName} ${targetYear}`;

                const updatedHistory = [...allTrips, ...newProcessedTrips];
                updatedHistory.sort((a, b) => (a.year !== b.year ? a.year - b.year : a.month !== b.month ? a.month - b.month : a.day - b.day));

                const newFileEntry = {
                    id: fileToken,
                    name: generatedFileName,
                    dateUploaded: new Date().toLocaleDateString(),
                    rawContent: text,
                    targetYear: targetYear
                };

                const updatedFiles = [...uploadedFiles, newFileEntry];
                setAllTrips(updatedHistory);
                setUploadedFiles(updatedFiles);
                saveDataToCloud(updatedHistory, updatedFiles);

                setSelectedPeriod(`${String(firstItem.month).padStart(2, '0')}-${targetYear}`);
                alert(lang === 'es' ? `¡Roster "${generatedFileName}" procesado correctamente!` : `Roster "${generatedFileName}" successfully processed!`);
            };

            const handleRestoreTrips = () => {
                if (uploadedFiles.length === 0) return;
                
                let restoredTrips = [];
                uploadedFiles.forEach(file => {
                    if (file.rawContent && file.targetYear) {
                        const { trips } = parseFileToTrips(file.rawContent, file.targetYear, file.id);
                        restoredTrips = [...restoredTrips, ...trips];
                    }
                });

                restoredTrips.sort((a, b) => (a.year !== b.year ? a.year - b.year : a.month !== b.month ? a.month - b.month : a.day - b.day));
                setAllTrips(restoredTrips);
                saveDataToCloud(restoredTrips, uploadedFiles);
                alert(lang === 'es' ? '¡Se han restablecido todos los viajes a su estado original del roster!' : 'All trips have been restored to their original roster state!');
            };

            const processFileObject = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setPendingFileContent(event.target.result);
                };
                reader.readAsText(file);
            };

            const handleFileUpload = (e) => {
                processFileObject(e.target.files[0]);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = () => {
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFileObject(e.dataTransfer.files[0]);
                }
            };

            const handleDeleteFile = (fileId, fileName) => {
                if (confirm(lang === 'es' ? `¿Deseas eliminar el roster "${fileName}" y todos sus turnos asociados?` : `Do you want to delete roster "${fileName}" and all associated duties?`)) {
                    const remainingTrips = allTrips.filter(t => t.fileToken !== fileId);
                    const remainingFiles = uploadedFiles.filter(f => f.id !== fileId);
                    setAllTrips(remainingTrips);
                    setUploadedFiles(remainingFiles);
                    saveDataToCloud(remainingTrips, remainingFiles);
                }
            };

            const handleClearHistory = () => {
                if (confirm(lang === 'es' ? `¿Deseas vaciar TODO el histórico de rosters para ${currentUser}?` : `Do you want to clear ALL roster history for ${currentUser}?`)) {
                    setAllTrips([]);
                    setUploadedFiles([]);
                    saveDataToCloud([], []);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!window.firebaseAppInstances) return;
                setIsActionLoading(true);
                const { auth, signInWithEmailAndPassword, db, collection, getDocs } = window.firebaseAppInstances;
                
                let targetInput = inputEmail.trim();
                let targetEmail = targetInput;

                if (!targetInput.includes('@')) {
                    try {
                        const querySnapshot = await getDocs(collection(db, "users"));
                        let foundEmail = null;
                        querySnapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            if (data.name && data.name.toLowerCase() === targetInput.toLowerCase()) {
                                foundEmail = data.email;
                            }
                        });
                        if (foundEmail) {
                            targetEmail = foundEmail;
                        } else {
                            setIsActionLoading(false);
                            alert(t.userNotFound);
                            return;
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }

                try {
                    await signInWithEmailAndPassword(auth, targetEmail, inputPassword.trim());
                    setInputEmail('');
                    setInputPassword('');
                } catch (error) {
                    alert(lang === 'es' ? 'Usuario/Correo o contraseña incorrectos.' : 'Incorrect Username/Email or Password.');
                } finally {
                    setIsActionLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!window.firebaseAppInstances) return;
                setIsActionLoading(true);
                const { auth, createUserWithEmailAndPassword, db, doc, setDoc, updateProfile } = window.firebaseAppInstances;
                const name = inputName.trim();
                const email = inputEmail.trim().toLowerCase();
                const password = inputPassword.trim();

                if (!name || !email || !password) {
                    setIsActionLoading(false);
                    alert(lang === 'es' ? 'Por favor, rellena todos los campos.' : 'Please fill in all fields.');
                    return;
                }

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: name });
                    
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        name: name,
                        name_lowercase: name.toLowerCase(),
                        email: email
                    });

                    setCurrentUser(name);
                    setCurrentUid(userCredential.user.uid);
                    setInputName('');
                    setInputEmail('');
                    setInputPassword('');
                    setViewMode('login');
                } catch (error) {
                    alert(lang === 'es' ? 'Error en el registro: ' + error.message : 'Registration error: ' + error.message);
                } finally {
                    setIsActionLoading(false);
                }
            };

            const handleForgot = async (e) => {
                e.preventDefault();
                if (!window.firebaseAppInstances) return;
                setIsActionLoading(true);

                const { auth, sendPasswordResetEmail, db, collection, getDocs } = window.firebaseAppInstances;
                let targetInput = inputEmail.trim();
                let targetEmail = targetInput;

                if (!targetInput) {
                    setIsActionLoading(false);
                    alert(lang === 'es' ? 'Por favor, introduce tu correo electrónico.' : 'Please enter your email address.');
                    return;
                }

                try {
                    if (!targetInput.includes('@')) {
                        const querySnapshot = await getDocs(collection(db, "users"));
                        let foundEmail = null;
                        querySnapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            if (data.name && data.name.toLowerCase() === targetInput.toLowerCase()) {
                                foundEmail = data.email;
                            }
                        });
                        if (foundEmail) {
                            targetEmail = foundEmail;
                        } else {
                            setIsActionLoading(false);
                            alert(t.emailNotFound);
                            return;
                        }
                    } else {
                        const querySnapshot = await getDocs(collection(db, "users"));
                        let found = false;
                        querySnapshot.forEach((docSnap) => {
                            const data = docSnap.data();
                            if (data.email && data.email.toLowerCase() === targetInput.toLowerCase()) {
                                found = true;
                            }
                        });
                        if (!found) {
