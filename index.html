        function App() {
            const [lang, setLang] = React.useState('es');
            const t = translations[lang];

            const [currentUser, setCurrentUser] = React.useState(null);
            const [currentEmail, setCurrentEmail] = React.useState('');
            const [authLoading, setAuthLoading] = React.useState(true);
            const [isActionLoading, setIsActionLoading] = React.useState(false);

            const [viewMode, setViewMode] = React.useState('login'); 
            const [inputName, setInputName] = React.useState('');
            const [inputEmail, setInputEmail] = React.useState('');
            const [inputPassword, setInputPassword] = React.useState('');
            const [maskedEmail, setMaskedEmail] = React.useState('');

            const [rosterText, setRosterText] = React.useState('');
            const [isMenuOpen, setIsMenuOpen] = React.useState(false);
            const [isFilesOpen, setIsFilesOpen] = React.useState(false);
            const [expandedYear, setExpandedYear] = React.useState('2026');
            const [isDragging, setIsDragging] = React.useState(false);
            
            const [pendingFileContent, setPendingFileContent] = React.useState(null);
            const [pendingFileName, setPendingFileName] = React.useState('');
            const [selectedModalYear, setSelectedModalYear] = React.useState('2026');
            
            const [allTrips, setAllTrips] = React.useState([]);
            const [uploadedFiles, setUploadedFiles] = React.useState([]);
            const [selectedPeriod, setSelectedPeriod] = React.useState('09-2026');

            React.useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.firebaseAppInstances) {
                        clearInterval(checkInterval);
                        const { auth, onAuthStateChanged, db, doc, getDoc } = window.firebaseAppInstances;
                        
                        onAuthStateChanged(auth, async (user) => {
                            if (user) {
                                setCurrentEmail(user.email);
                                let name = user.displayName;
                                if (!name && db && doc && getDoc) {
                                    try {
                                        const userDoc = await getDoc(doc(db, "users", user.uid));
                                        if (userDoc.exists()) {
                                            name = userDoc.data().name;
                                        }
                                    } catch (e) {
                                        console.error(e);
                                    }
                                }
                                setCurrentUser(name || user.email.split('@')[0]);
                            } else {
                                setCurrentUser(null);
                                setCurrentEmail('');
                            }
                            setAuthLoading(false);
                        });
                    }
                }, 100);
            }, []);

            React.useEffect(() => {
                if (!currentUser || !window.firebaseAppInstances) return;
                const { db, doc, onSnapshot, auth } = window.firebaseAppInstances;
                const userUid = auth && auth.currentUser ? auth.currentUser.uid : currentUser;

                const unsubscribe = onSnapshot(doc(db, "crew_data", userUid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.trips) setAllTrips(data.trips);
                        if (data.files) setUploadedFiles(data.files);
                    }
                });

                return () => unsubscribe();
            }, [currentUser]);

            const saveDataToCloud = async (newTrips, newFiles) => {
                if (!window.firebaseAppInstances) return;
                const { db, doc, setDoc, auth } = window.firebaseAppInstances;
                const userUid = auth && auth.currentUser ? auth.currentUser.uid : currentUser;
                try {
                    await setDoc(doc(db, "crew_data", userUid), {
                        trips: newTrips,
                        files: newFiles
                    }, { merge: true });
                } catch (e) {
                    console.error("Error guardando datos:", e);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!window.firebaseAppInstances) return;
                setIsActionLoading(true);
                const { auth, signInWithEmailAndPassword, db, collection, query, where, getDocs } = window.firebaseAppInstances;
                
                let targetEmail = inputEmail.trim();

                if (!targetEmail.includes('@')) {
                    try {
                        const q = query(collection(db, "users"), where("name_lowercase", "==", targetEmail.toLowerCase()));
                        const querySnapshot = await getDocs(q);
                        if (!querySnapshot.empty) {
                            targetEmail = querySnapshot.docs[0].data().email;
                        } else {
                            setIsActionLoading(false);
                            alert(lang === 'es' ? 'Nombre de usuario no encontrado.' : 'Username not found.');
                            return;
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }

                try {
                    await signInWithEmailAndPassword(auth, targetEmail, inputPassword.trim());
                    setInputEmail('');
                    setInputPassword('');
                } catch (error) {
                    alert(lang === 'es' ? 'Usuario/Correo o contraseña incorrectos.' : 'Incorrect Username/Email or Password.');
                } finally {
                    setIsActionLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!window.firebaseAppInstances) return;
                setIsActionLoading(true);
                const { auth, createUserWithEmailAndPassword, db, doc, setDoc, updateProfile } = window.firebaseAppInstances;
                const name = inputName.trim();
                const email = inputEmail.trim().toLowerCase();
                const password = inputPassword.trim();

                if (!name || !email || !password) {
                    setIsActionLoading(false);
                    alert(lang === 'es' ? 'Por favor, rellena todos los campos.' : 'Please fill in all fields.');
                    return;
                }

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: name });
                    
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        name: name,
                        name_lowercase: name.toLowerCase(),
                        email: email
                    });

                    setCurrentUser(name);
                    setInputName('');
                    setInputEmail('');
                    setInputPassword('');
                    setViewMode('login');
                } catch (error) {
                    alert(lang === 'es' ? 'Error en el registro: ' + error.message : 'Registration error: ' + error.message);
                } finally {
                    setIsActionLoading(false);
                }
            };

            const handleForgot = async (e) => {
                e.preventDefault();
                if (!window.firebaseAppInstances) return;
                setIsActionLoading(true);

                const { auth, sendPasswordResetEmail, db, collection, query, where, getDocs } = window.firebaseAppInstances;
                const targetEmail = inputEmail.trim().toLowerCase();

                if (!targetEmail || !targetEmail.includes('@')) {
                    setIsActionLoading(false);
                    alert(lang === 'es' ? 'Por favor, introduce un correo electrónico válido.' : 'Please enter a valid email address.');
                    return;
                }

                try {
                    // Verificar si el correo realmente existe en la colección de usuarios
                    const q = query(collection(db, "users"), where("email", "==", targetEmail));
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        setIsActionLoading(false);
                        alert(t.emailNotFound);
                        return;
                    }

                    // Enviar correo de recuperación
                    await sendPasswordResetEmail(auth, targetEmail);

                    const parts = targetEmail.split('@');
                    const usernamePart = parts[0];
                    const domainPart = parts[1] || 'email.com';
                    let maskedUser = usernamePart.length > 2 ? usernamePart.substring(0, 2) + '***' : '***';
                    setMaskedEmail(`${maskedUser}@${domainPart}`);

                    setViewMode('sent');
                } catch (error) {
                    if (error.code === 'auth/user-not-found') {
                        alert(t.emailNotFound);
                    } else {
                        alert(lang === 'es' ? 'Error al enviar correo: ' + error.message : 'Error sending email: ' + error.message);
                    }
                } finally {
                    setIsActionLoading(false);
                }
            };

            const handleLogout = async () => {
                if (!window.firebaseAppInstances) return;
                const { auth, signOut } = window.firebaseAppInstances;
                await signOut(auth);
            };

            if (authLoading) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center">
                        <div className="text-slate-500 font-semibold text-sm flex items-center gap-2">
                            <span className="w-4 h-4 border-2 border-red-600 border-t-transparent rounded-full animate-spin"></span>
                            Cargando QrewSlip...
                        </div>
                    </div>
                );
            }

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                            
                            {/* LOGO DE QREWSLIP */}
                            <div className="flex justify-center mb-6">
                                <div className="flex items-center gap-2">

                                        Q
                                    </div>
                                    <span className="text-2xl font-black text-slate-900 tracking-tight">Qrew<span className="text-red-600">Slip</span></span>
                                </div>
                            </div>

                            <div className="text-center mb-6">
                                <span className="text-[11px] font-black text-red-600 tracking-widest uppercase block">CABIN CREW PORTAL</span>
                                <h2 className="text-xl font-bold text-slate-900 mt-1">
                                    {viewMode === 'register' ? t.registerTitle : viewMode === 'forgot' ? t.forgotTitle : viewMode === 'sent' ? t.forgotTitle : t.loginTitle}
                                </h2>
                            </div>

                            <div className="flex justify-center mb-6">
                                <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                                    <button onClick={() => setLang('es')} className={`px-3 py-1.5 rounded-lg transition-colors ${lang === 'es' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-600'}`}>🇪🇸 ESP</button>
                                    <button onClick={() => setLang('en')} className={`px-3 py-1.5 rounded-lg transition-colors ${lang === 'en' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-600'}`}>🇬🇧 ENG</button>
                                </div>
                            </div>

                            {/* VISTA 1: LOGIN */}
                            {viewMode === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.emailLabel}</label>
                                        <input type="text" placeholder="tu.correo@email.com o usuario" value={inputEmail} onChange={(e) => setInputEmail(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-red-600" required autoFocus />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.passwordLabel}</label>
                                        <input type="password" placeholder="••••••••" value={inputPassword} onChange={(e) => setInputPassword(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-red-600" required />
                                    </div>

                                    <button type="submit" disabled={isActionLoading} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition-colors shadow-md mt-2 flex items-center justify-center gap-2 disabled:opacity-50">
                                        {isActionLoading && <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>}
                                        {isActionLoading ? t.sendingBtn : t.loginBtn}
                                    </button>
                                </form>
                            )}

                            {/* VISTA 2: REGISTER */}
                            {viewMode === 'register' && (
                                <form onSubmit={handleRegister} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.nameLabel}</label>
                                        <input type="text" placeholder="Ej: Jluisana" value={inputName} onChange={(e) => setInputName(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-red-600" required autoFocus />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.emailLabel}</label>
                                        <input type="email" placeholder="tu.correo@email.com" value={inputEmail} onChange={(e) => setInputEmail(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-red-600" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.passwordLabel}</label>
                                        <input type="password" placeholder="••••••••" value={inputPassword} onChange={(e) => setInputPassword(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-red-600" required />
                                    </div>
                                    <button type="submit" disabled={isActionLoading} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition-colors shadow-md mt-2 flex items-center justify-center gap-2 disabled:opacity-50">
                                        {isActionLoading && <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>}
                                        {isActionLoading ? t.sendingBtn : t.registerBtn}
                                    </button>
                                </form>
                            )}

                            {/* VISTA 3: FORGOT PASSWORD (SÓLO CORREO) */}
                            {viewMode === 'forgot' && (
                                <form onSubmit={handleForgot} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.emailLabel}</label>
                                        <input 
                                            type="email" 
                                            placeholder="tu.correo@email.com" 
                                            value={inputEmail} 
                                            onChange={(e) => setInputEmail(e.target.value)} 
                                            className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 outline-none focus:ring-2 focus:ring-red-600" 
                                            required 
                                            autoFocus 
                                        />
                                    </div>
                                    <button type="submit" disabled={isActionLoading} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition-colors shadow-md mt-2 flex items-center justify-center gap-2 disabled:opacity-50">
                                        {isActionLoading && <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>}
                                        {isActionLoading ? t.sendingBtn : t.recoverBtn}
                                    </button>
                                    <div className="text-center pt-2">
                                        <button type="button" onClick={() => { setViewMode('login'); setInputEmail(''); }} className="text-xs font-semibold text-red-600 hover:text-red-700 transition-colors">
                                            {t.backToLogin}
                                        </button>
                                    </div>
                                </form>
                            )}

                            {/* VISTA 4: SENT CONFIRMATION */}
                            {viewMode === 'sent' && (
                                <div className="space-y-4 text-center py-2">
                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                                    <p className="text-xs text-slate-600 leading-relaxed">
                                        {lang === 'es' ? 'El enlace de recuperación se ha enviado a ' : 'The recovery link has been sent to '}
                                        <b className="text-slate-900">{maskedEmail}</b>
                                    </p>
                                    <button onClick={() => { setViewMode('login'); setInputEmail(''); }} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-sm transition-colors mt-4">
                                        {t.backToLogin}
                                    </button>
                                </div>
                            )}

                            {/* ENLACES INFERIORES */}
                            {viewMode === 'login' && (
                                <div className="mt-5 text-center space-y-2 border-t border-slate-100 pt-4">
                                    <div>
                                        <button 
                                            type="button" 
                                            onClick={() => { setViewMode('forgot'); setInputEmail(''); }} 
                                            className="text-xs font-semibold text-red-600 hover:text-red-700 transition-colors"
                                        >
                                            {t.forgotPasswordLink}
                                        </button>
                                    </div>
                                    <div>
                                        <button 
                                            onClick={() => { setViewMode('register'); setInputName(''); setInputEmail(''); setInputPassword(''); }} 
                                            className="text-xs font-semibold text-red-600 hover:text-red-700 transition-colors"
                                        >
                                            {t.switchToRegister}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {viewMode === 'register' && (
                                <div className="mt-5 text-center border-t border-slate-100 pt-4">
                                    <button 
                                        onClick={() => { setViewMode('login'); setInputName(''); setInputEmail(''); setInputPassword(''); }} 
                                        className="text-xs font-semibold text-red-600 hover:text-red-700 transition-colors"
                                    >
                                        {t.switchToLogin}
                                    </button>
                                </div>
                            )}

                );
            }

            // HOME HABITUAL (LOGUEADO)
            const basePay = 1916.58;
            const fixedAllowance = 80.27;
            const singaporeAllowancePerTrip = 421.32; 
            const perthAllowancePerTrip = 239.12;
            const holidayRatePerDay = 17.39; 

            const getTripDuration = (trip) => {
                if (trip.holiday) return trip.count || 1;
                if (trip.type === 'perth') return 6;
                return 4; 
            };

            const getTripEndDate = (trip) => {
                const startDate = new Date(trip.year, trip.month - 1, trip.day);
                const durationDays = getTripDuration(trip);
                const endDate = new Date(startDate);
                endDate.setDate(endDate.getDate() + (durationDays - 1));
                return endDate;
            };

            const getPeriodStatus = (monthStr, yearNum) => {
                const targetM = parseInt(monthStr, 10);
                const targetY = yearNum;
                
                const prevM = targetM === 1 ? 12 : targetM - 1;
                const prevY = targetM === 1 ? targetY - 1 : targetY;

                const periodTrips = allTrips.filter(f => {
                    const endDate = getTripEndDate(f);
                    const endM = endDate.getMonth() + 1;
                    const endY = endDate.getFullYear();
                    const endD = endDate.getDate();

                    return (endY === prevY && endM === prevM && endD >= 16) || (endY === targetY && endM === targetM && endD <= 15);
                });

                if (periodTrips.length === 0) return 'empty';
                return 'complete';
            };

            const confirmAndProcessRoster = (targetYear) => {
                const text = pendingFileContent;
                const fileName = pendingFileName || 'Roster.txt';
                setPendingFileContent(null);
                setPendingFileName('');
                if (!text || !text.trim()) return;

                const lines = text.split(/\r?\n/);
                let rawDutyList = [];

                lines.forEach(line => {
                    if (line.includes('|') && line.match(/\b\d{2}\/\d{2}\b/)) {
                        const columns = line.split('|');
                        columns.forEach(col => {
                            const trimmedCol = col.trim();
                            const matchPattern = trimmedCol.match(/(\d{2})\/(\d{2})\s+[A-Z]?\s*(SIL\d+|PRL[A-Z0-9]*|QF\d+|SBY|SR|AL)/);
                            if (matchPattern) {
                                let day = parseInt(matchPattern[1], 10);
                                let month = parseInt(matchPattern[2], 10);

                                rawDutyList.push({
                                    day,
                                    month,
                                    year: targetYear,
                                    dateStr: `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${targetYear}`,
                                    duty: matchPattern[3]
                                });
                            }
                        });
                    }
                });

                if (rawDutyList.length === 0) {
                    alert(lang === 'es' ? 'No se pudieron leer los vuelos o turnos del archivo.' : 'Could not read flights or duties from file.');
                    return;
                }

                rawDutyList.sort((a, b) => (a.month !== b.month ? a.month - b.month : a.day - b.day));

                const newProcessedTrips = [];
                let currentHolidayBlock = null;
                let currentSbyBlock = null;
                const fileToken = `${fileName}_${Date.now()}`;

                rawDutyList.forEach(item => {
                    const isSby = item.duty === 'SBY' || item.duty === 'SR';
                    const isAL = item.duty === 'AL';

                    if (currentSbyBlock && !isSby) {
                        newProcessedTrips.push({ ...currentSbyBlock, fileToken });
                        currentSbyBlock = null;
                    }

                    if (currentHolidayBlock && !isAL) {
                        newProcessedTrips.push({ ...currentHolidayBlock, fileToken });
                        currentHolidayBlock = null;
                    }

                    if (isAL) {
                        if (!currentHolidayBlock) {
                            currentHolidayBlock = {
                                id: Date.now() + Math.random(),
                                day: item.day,
                                month: item.month,
                                year: item.year,
                                dateStr: item.dateStr,
                                duty: lang === 'es' ? 'Vacaciones (AL)' : 'Holiday (AL)',
                                type: 'holiday',
                                count: 1,
                                delay16h: false,
                                delaySectorsCount: 1,
                                holiday: true,
                                calledOut: false
                            };
                        } else {
                            currentHolidayBlock.count += 1;
                        }
                    } else if (isSby) {
                        if (!currentSbyBlock) {
                            currentSbyBlock = {
                                id: Date.now() + Math.random(),
                                day: item.day,
                                month: item.month,
                                year: item.year,
                                dateStr: item.dateStr,
                                duty: 'Bloque SBY (Standby)',
                                dutyBase: 'SBY',
                                type: 'sby',
                                count: 1,
                                delay16h: false,
                                delaySectorsCount: 1,
                                holiday: false,
                                calledOut: false,
                                callType: 'singapore'
                            };
                        } else {
                            currentSbyBlock.count += 1;
                        }
                    } else {
                        const isPerth = item.duty.startsWith('PRL') || item.duty === 'QF10' || item.duty === 'QF209';
                        const duration = isPerth ? 6 : 4;

                        const isOverlapping = (tripList) => tripList.some(t => {
                            if (t.holiday) return false;
                            const tStart = new Date(t.year, t.month - 1, t.day).getTime();
                            const tEnd = getTripEndDate(t).getTime();
                            const itemTime = new Date(item.year, item.month - 1, item.day).getTime();
                            return itemTime >= tStart && itemTime <= tEnd;
                        });

                        if (!isOverlapping(newProcessedTrips) && !isOverlapping(allTrips)) {
                            newProcessedTrips.push({
                                id: Date.now() + Math.random(),
                                day: item.day,
                                month: item.month,
                                year: item.year,
                                dateStr: item.dateStr,
                                duty: item.duty.substring(0, 5),
                                dutyBase: item.duty,
                                type: isPerth ? 'perth' : 'singapore',
                                count: duration,
                                delay16h: false,
                                delaySectorsCount: 1,
                                holiday: false,
                                calledOut: false,
                                fileToken
                            });
                        }
                    }
                });

                if (currentHolidayBlock) newProcessedTrips.push({ ...currentHolidayBlock, fileToken });
                if (currentSbyBlock) newProcessedTrips.push({ ...currentSbyBlock, fileToken });

                const updatedHistory = [...allTrips, ...newProcessedTrips];
                updatedHistory.sort((a, b) => (a.year !== b.year ? a.year - b.year : a.month !== b.month ? a.month - b.month : a.day - b.day));

                const newFileEntry = {
                    id: fileToken,
                    name: fileName,
                    dateUploaded: new Date().toLocaleDateString()
                };

                const updatedFiles = [...uploadedFiles, newFileEntry];
                setAllTrips(updatedHistory);
                setUploadedFiles(updatedFiles);
                saveDataToCloud(updatedHistory, updatedFiles);

                setSelectedPeriod(`09-${targetYear}`);
                alert(lang === 'es' ? `¡Roster "${fileName}" procesado correctamente!` : `Roster "${fileName}" successfully processed!`);
            };

            const processFileObject = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setRosterText(event.target.result);
                    setPendingFileContent(event.target.result);
                    setPendingFileName(file.name);
                };
                reader.readAsText(file);
            };

            const handleFileUpload = (e) => {
                processFileObject(e.target.files[0]);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = () => {
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFileObject(e.dataTransfer.files[0]);
                }
            };

            const handleDeleteFile = (fileId, fileName) => {
                if (confirm(lang === 'es' ? `¿Deseas eliminar el roster "${fileName}" y todos sus turnos asociados?` : `Do you want to delete roster "${fileName}" and all associated duties?`)) {
                    const remainingTrips = allTrips.filter(t => t.fileToken !== fileId);
                    const remainingFiles = uploadedFiles.filter(f => f.id !== fileId);
                    setAllTrips(remainingTrips);
                    setUploadedFiles(remainingFiles);
                    saveDataToCloud(remainingTrips, remainingFiles);
                }
            };

            const handleClearHistory = () => {
                if (confirm(lang === 'es' ? `¿Deseas vaciar TODO el histórico de rosters para ${currentUser}?` : `Do you want to clear ALL roster history for ${currentUser}?`)) {
                    setAllTrips([]);
                    setUploadedFiles([]);
                    saveDataToCloud([], []);
                }
            };

            let filteredTrips = [];
            if (selectedPeriod === 'all') {
                filteredTrips = allTrips;
            } else {
                const [targetMStr, targetYStr] = selectedPeriod.split('-');
                const targetM = parseInt(targetMStr, 10);
                const targetY = parseInt(targetYStr, 10);
                
                const prevM = targetM === 1 ? 12 : targetM - 1;
                const prevY = targetM === 1 ? targetY - 1 : targetY;

                filteredTrips = allTrips.filter(f => {
                    const endDate = getTripEndDate(f);
                    const endM = endDate.getMonth() + 1;
                    const endY = endDate.getFullYear();
                    const endD = endDate.getDate();

                    return (endY === prevY && endM === prevM && endD >= 16) || (endY === targetY && endM === targetM && endD <= 15);
                });
            }

            const getTripHours = (f) => {
                if (f.holiday) return 0;
                if (f.type === 'sby') {
                    if (f.calledOut) {
                        const flightHrs = f.callType === 'perth' ? 41.4 : 26.0;
                        const standbyPrepHrs = Math.max(0, ((f.count || 1) - 1) * 8.0); 
                        return flightHrs + standbyPrepHrs;
                    } else {
                        return (f.count || 1) * 8.0;
                    }
                }
                if (f.type === 'perth') return 41.4; 
                if (f.type === 'singapore') return 26.0;
                return 0;
            };

            const allTripsSorted = [...allTrips].sort((a, b) => new Date(b.year, b.month - 1, b.day) - new Date(a.year, a.month - 1, a.day));
            let rollingMonthHours = 0;
            if (allTripsSorted.length > 0) {
                const latestTrip = allTripsSorted[0];
                const latestDate = new Date(latestTrip.year, latestTrip.month - 1, latestTrip.day);
                const cutoffDate = new Date(latestDate);
                cutoffDate.setDate(cutoffDate.getDate() - 28);

                rollingMonthHours = allTrips.reduce((acc, f) => {
                    const tripDate = new Date(f.year, f.month - 1, f.day);
                    if (tripDate >= cutoffDate && tripDate <= latestDate) {
                        return acc + getTripHours(f);
                    }
                    return acc;
                }, 0);
            }

            let rollingYearHours = 0;
            if (allTripsSorted.length > 0) {
                const latestTrip = allTripsSorted[0];
                const latestDate = new Date(latestTrip.year, latestTrip.month - 1, latestTrip.day);
                const cutoffYearDate = new Date(latestDate);
                cutoffYearDate.setFullYear(cutoffYearDate.getFullYear() - 1);

                rollingYearHours = allTrips.reduce((acc, f) => {
                    const tripDate = new Date(f.year, f.month - 1, f.day);
                    if (tripDate >= cutoffYearDate && tripDate <= latestDate) {
                        return acc + getTripHours(f);
                    }
                    return acc;
                }, 0);
            }

            const calculatedSectorPay = filteredTrips.reduce((acc, f) => {
                if (f.holiday) return acc;
                let total = 0;
                if (f.type === 'perth' || (f.type === 'sby' && f.calledOut && f.callType === 'perth')) {
                    total = 152.02 + 37.42 + 74.85; 
                } else if (f.type === 'singapore' || (f.type === 'sby' && f.calledOut && f.callType === 'singapore')) {
                    total = 74.85 * 2; 
                }
                
                if (f.delay16h) {
                    const delaySectors = f.delaySectorsCount || 1;
                    total += (delaySectors * 119.75);
                }
                return acc + total;
            }, 0);

            const calculatedAllowances = filteredTrips.reduce((acc, f) => {
                if (f.type === 'singapore' || (f.type === 'sby' && f.calledOut && f.callType === 'singapore')) return acc + singaporeAllowancePerTrip;
                if (f.type === 'perth' || (f.type === 'sby' && f.calledOut && f.callType === 'perth')) return acc + perthAllowancePerTrip;
                return acc;
            }, 0);

            const calculatedHolidayPay = filteredTrips.reduce((acc, f) => {
                if (f.holiday) return acc + (f.count * holidayRatePerDay);
                return acc;
            }, 0);

            const estimatedGross = basePay + fixedAllowance + calculatedSectorPay + calculatedAllowances + calculatedHolidayPay;

            const taxFreeAllowanceMonthly = 1107.50; 
            const taxableAmount = Math.max(0, estimatedGross - taxFreeAllowanceMonthly);
            const estimatedTax = taxableAmount * 0.20;

            const niThresholdMonthly = 1048.00;
            let estimatedNI = 0;
            if (estimatedGross > niThresholdMonthly) {
                const niSubjectAmount = Math.min(estimatedGross, 4189.00) - niThresholdMonthly;
                estimatedNI = niSubjectAmount * 0.08;
            }

            const estimatedPension = (basePay + fixedAllowance) * 0.05; 
            const totalDeductions = estimatedTax + estimatedNI + estimatedPension;
            const estimatedNet = estimatedGross - totalDeductions;

            const handleDeleteTrip = (id) => {
                const updated = allTrips.filter(t => t.id !== id);
                setAllTrips(updated);
                saveDataToCloud(updated, uploadedFiles);
            };

            const toggleDelay = (id) => {
                const updated = allTrips.map(t => t.id === id ? {...t, delay16h: !t.delay16h} : t);
                setAllTrips(updated);
                saveDataToCloud(updated, uploadedFiles);
            };

            const setDelaySectors = (id, count) => {
                const updated = allTrips.map(t => t.id === id ? {...t, delaySectorsCount: parseInt(count, 10)} : t);
                setAllTrips(updated);
                saveDataToCloud(updated, uploadedFiles);
            };

            const toggleCallOut = (id) => {
                const updated = allTrips.map(t => {
                    if (t.id === id) {
                        const nextCalled = !t.calledOut;
                        return {
                            ...t,
                            calledOut: nextCalled,
                            callType: nextCalled ? 'singapore' : 'singapore'
                        };
                    }
                    return t;
                });
                setAllTrips(updated);
                saveDataToCloud(updated, uploadedFiles);
            };

            const setSbyCallType = (id, type) => {
                const updated = allTrips.map(t => t.id === id ? {...t, callType: type} : t);
                setAllTrips(updated);
                saveDataToCloud(updated, uploadedFiles);
            };

            const currentYear = new Date().getFullYear();
            const availableYears = [];
            for (let y = 2025; y <= currentYear; y++) {
                availableYears.push(y);
            }

            const [targetMShow, targetYShow] = selectedPeriod !== 'all' ? selectedPeriod.split('-') : [null, null];
            const currentMonthName = targetMShow ? t.months[parseInt(targetMShow, 10) - 1] : '';
            const currentLabel = selectedPeriod === 'all' ? t.viewAll : `${currentMonthName} ${targetYShow}`;
            
            const currentPeriodStatus = selectedPeriod !== 'all' ? getPeriodStatus(targetMShow, parseInt(targetYShow, 10)) : 'all';

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6 pb-12 relative">
                    
                    {pendingFileContent && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">{t.modalYearTitle}</h3>
                                <p className="text-xs text-slate-500 mb-4">{t.modalYearSub} <b>{currentUser}</b>:</p>
                                <select 
                                    value={selectedModalYear}
                                    onChange={(e) => setSelectedModalYear(e.target.value)}
                                    className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-slate-50 mb-6"
                                >
                                    {availableYears.map(y => (
                                        <option key={y} value={y}>{y}</option>
                                    ))}
                                </select>
                                <div className="flex gap-3">
                                    <button onClick={() => setPendingFileContent(null)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm transition-colors">{t.cancel}</button>
                                    <button onClick={() => confirmAndProcessRoster(parseInt(selectedModalYear, 10))} className="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-xl text-sm transition-colors shadow-sm">{t.confirm}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CABECERA CON LOG OUT Y MARCA QREWSLIP */}
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-200 pb-6">
                        <div className="flex items-center gap-3 sm:gap-4 w-full sm:w-auto justify-center sm:justify-start">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center text-white font-black text-base shadow-md transform -rotate-3">
                                    Q
                                </div>
                                <span className="text-xl font-black text-slate-900 tracking-tight">Qrew<span className="text-red-600">Slip</span></span>
                            </div>
                            <div className="border-l border-slate-200 pl-3">
                                <span className="text-[10px] sm:text-[11px] font-black text-red-600 tracking-widest uppercase block leading-tight">CABIN CREW</span>
                                <span className="text-[9px] sm:text-[10px] font-bold text-slate-500 tracking-wider uppercase block">Roster & Payroll</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-3 w-full sm:w-auto justify-center">
                            <div className="flex bg-slate-200/70 p-1 rounded-xl text-xs font-bold">
                                <button onClick={() => setLang('es')} className={`px-3 py-1.5 rounded-lg transition-colors ${lang === 'es' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-600'}`}>🇪🇸 ESP</button>
                                <button onClick={() => setLang('en')} className={`px-3 py-1.5 rounded-lg transition-colors ${lang === 'en' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-600'}`}>🇬🇧 ENG</button>
                            </div>

                            <div className="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-xs border border-slate-200">
                                <span className="text-xs font-bold text-slate-700 pl-2">👤 {currentUser}</span>
                                <button onClick={handleLogout} className="bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-3 py-2 rounded-xl transition-colors">{t.logout}</button>
                            </div>
                        </div>
                    </div>

                    <div className="text-center mb-8">
                        <h2 className="text-2xl sm:text-3xl font-bold text-slate-900">{t.subtitle}</h2>
                    </div>

                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 relative">
                        <div className="w-full sm:w-auto relative">
                            <span className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">{t.activePeriod} ({currentUser}):</span>
                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="w-full sm:w-80 bg-slate-50 hover:bg-slate-100 border border-slate-300 font-semibold py-3 px-4 rounded-xl text-sm flex items-center justify-between transition-colors shadow-2xs">
                                <div className="flex items-center gap-2.5">
                                    {selectedPeriod !== 'all' ? (
                                        <span className={`w-3 h-3 rounded-full ${
                                            currentPeriodStatus === 'complete' ? 'bg-emerald-500 ring-2 ring-emerald-100' : 'bg-slate-300'
                                        }`}></span>
                                    ) : (<span className="text-red-600 font-bold">🔍</span>)}
                                    <span className="text-slate-800">{currentLabel}</span>
                                </div>
                                <span className={`text-slate-400 transform transition-transform duration-200 ${isMenuOpen ? 'rotate-180' : ''}`}>▼</span>
                            </button>

                            {isMenuOpen && (
                                <div className="absolute top-full left-0 mt-2 w-full sm:w-80 bg-white border border-slate-200 rounded-2xl shadow-xl z-40 p-3 space-y-3 max-h-96 overflow-y-auto">
                                    {availableYears.sort((a, b) => b - a).map(year => (
                                        <div key={year} className="border-b border-slate-100 pb-2 last:border-0">
                                            <button onClick={() => setExpandedYear(expandedYear === String(year) ? null : String(year))} className="w-full flex items-center justify-between text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 p-2.5 rounded-lg transition-colors">
                                                <span>{year}</span>
                                                <span>{expandedYear === String(year) ? '▲' : '▼'}</span>
                                            </button>
                                            {expandedYear === String(year) && (
                                                <div className="mt-1.5 pl-2 space-y-1">
                                                    {t.months.map((monthName, idx) => {
                                                        const mNum = String(idx + 1).padStart(2, '0');
                                                        const status = getPeriodStatus(mNum, year);
                                                        const periodKey = `${mNum}-${year}`;
                                                        const isSelected = selectedPeriod === periodKey;
                                                        return (
                                                            <button key={periodKey} onClick={() => { setSelectedPeriod(periodKey); setIsMenuOpen(false); }} className={`w-full flex items-center justify-between p-2 rounded-xl text-xs font-medium transition-colors text-left ${isSelected ? 'bg-red-50 text-red-700 font-bold' : 'hover:bg-slate-50 text-slate-700'}`}>
                                                                <span>{monthName} {year}</span>
                                                                <span className={`w-3 h-3 rounded-full flex-shrink-0 ${
                                                                    status === 'complete' ? 'bg-emerald-500 ring-2 ring-emerald-100' : 'bg-slate-300'
                                                                }`}></span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    <div className="pt-2 border-t border-slate-100">
                                        <button onClick={() => { setSelectedPeriod('all'); setIsMenuOpen(false); }} className="w-full flex items-center justify-between p-2.5 rounded-xl text-xs font-medium hover:bg-slate-50 text-red-600 font-semibold">
                                            <span>🔍 {t.viewAll}</span>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {allTrips.length > 0 && (
                            <button onClick={handleClearHistory} className="text-red-500 hover:text-red-700 text-xs font-medium underline">
                                {t.clearHistory} ({allTrips.length})
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{t.baseFixed}</span>
                            <h2 className="text-2xl font-bold text-slate-900 mt-1">£{(basePay + fixedAllowance).toFixed(2)}</h2>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{t.sectorsAllowances}</span>
                            <h2 className="text-2xl font-bold text-red-600 mt-1">£{(calculatedSectorPay + calculatedAllowances + calculatedHolidayPay).toFixed(2)}</h2>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{t.estGross}</span>
                            <h2 className="text-2xl font-bold text-slate-800 mt-1">£{estimatedGross.toFixed(2)}</h2>
                        </div>
                        <div className="bg-red-600 text-white p-5 rounded-2xl shadow-md transition-all">
                            <span className="text-xs font-bold uppercase tracking-wider text-red-100">{t.estNet}</span>
                            <h2 className="text-2xl font-black text-white mt-1">£{estimatedNet.toFixed(2)}</h2>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider text-slate-500">{t.rolling28}</span>
                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${rollingMonthHours > 90 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}`}>
                                    {rollingMonthHours.toFixed(1)}h / 100h {t.maxHours}
                                </span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div className={`h-2.5 rounded-full ${rollingMonthHours > 90 ? 'bg-amber-500' : 'bg-red-600'}`} style={{ width: `${Math.min((rollingMonthHours / 100) * 100, 100)}%` }}></div>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-xs font-bold uppercase tracking-wider text-slate-500">{t.rolling365}</span>
                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${rollingYearHours > 800 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}`}>
                                    {rollingYearHours.toFixed(1)}h / 900h {t.maxHours}
                                </span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div className={`h-2.5 rounded-full ${rollingYearHours > 800 ? 'bg-amber-500' : 'bg-red-600'}`} style={{ width: `${Math.min((rollingYearHours / 900) * 100, 100)}%` }}></div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 space-y-4">
                        <div>
                            <h3 className="text-lg font-semibold text-slate-800 mb-1">{t.addRosterTitle} {currentUser} (.txt)</h3>
                            <p className="text-xs text-slate-500 mb-3">{t.dragDropText}</p>
                            
                            <div 
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleDrop}
                                className={`border-2 border-dashed rounded-2xl p-8 text-center transition-colors ${isDragging ? 'border-red-600 bg-red-50/50' : 'border-slate-300 bg-slate-50/30 hover:bg-slate-50'}`}
                            >
                                <div className="text-3xl mb-2">📄</div>
                                <p className="text-xs font-semibold text-slate-700 mb-2">{t.dragDropText}</p>
                                <span className="text-[10px] text-slate-400 block mb-4">{t.orChoose}</span>
                                <label className="inline-block bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-5 rounded-xl text-sm cursor-pointer transition-colors shadow-sm">
                                    {t.selectFile}
                                    <input type="file" accept=".txt" onChange={handleFileUpload} className="hidden" />
                                </label>
                            </div>
                        </div>

                        {uploadedFiles.length > 0 && (
                            <div className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50">
                                <button 
                                    onClick={() => setIsFilesOpen(!isFilesOpen)}
                                    className="w-full p-3.5 flex justify-between items-center text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors"
                                >
                                    <span>📁 {t.uploadedHistory} ({uploadedFiles.length})</span>
                                    <span>{isFilesOpen ? t.hide : t.viewFiles}</span>
                                </button>
                                {isFilesOpen && (
                                    <div className="p-3 space-y-2">
                                        {uploadedFiles.map(file => (
                                            <div key={file.id} className="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200 shadow-2xs">
                                                <div>
                                                    <span className="text-xs font-bold text-slate-800 block">📄 {file.name}</span>
                                                    <span className="text-[10px] text-slate-400">{file.dateUploaded}</span>
                                                </div>
                                                <button 
                                                    onClick={() => handleDeleteFile(file.id, file.name)}
                                                    className="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1"
                                                >
                                                    {t.deleteRoster}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                <h3 className="text-lg font-semibold text-slate-800">{t.tripsInPeriod} ({filteredTrips.length})</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-400 font-medium border-b border-slate-100">
                                            <th className="p-4">Fecha / Date</th>
                                            <th className="p-4">Patrón / Duty</th>
                                            <th className="p-4">Tipo / Detail</th>
                                            <th className="p-4">Opciones</th>
                                            <th className="p-4 text-right">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredTrips.length === 0 ? (
                                            <tr>
                                                <td colSpan="5" className="p-6 text-center text-slate-400">
                                                    {t.noRoster}
                                                </td>
                                            </tr>
                                        ) : (
                                            filteredTrips.map(f => (
                                                <tr key={f.id} className="hover:bg-slate-50/50">
                                                    <td className="p-4 text-slate-600 font-medium">{f.dateStr}</td>
                                                    <td className="p-4 font-semibold text-slate-800">
                                                        {f.type === 'sby' && f.calledOut ? `Flight ${f.callType.toUpperCase()} (Call-out)` : f.duty}
                                                    </td>
                                                    <td className="p-4 text-slate-600 text-xs">
                                                        {f.holiday ? (
                                                            <span className="bg-amber-50 text-amber-700 px-2 py-0.5 rounded font-medium">{t.holidayBlock} {f.count} {t.days} (£{(f.count * holidayRatePerDay).toFixed(2)})</span>
                                                        ) : f.type === 'sby' ? (
                                                            <div className="space-y-1">
                                                                <span className={`px-2 py-0.5 rounded font-semibold inline-block ${f.calledOut ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                                                                    {f.calledOut ? `${t.activated} ${f.callType.toUpperCase()}` : `${t.standby} (${f.count || 1})`}
                                                                </span>
                                                                {f.calledOut && (
                                                                    <div className="flex gap-1 pt-1">
                                                                        <button onClick={() => setSbyCallType(f.id, 'singapore')} className={`text-[10px] px-1.5 py-0.5 rounded ${f.callType === 'singapore' ? 'bg-red-600 text-white font-bold' : 'bg-slate-200 text-slate-700'}`}>SIN</button>
                                                                        <button onClick={() => setSbyCallType(f.id, 'perth')} className={`text-[10px] px-1.5 py-0.5 rounded ${f.callType === 'perth' ? 'bg-red-600 text-white font-bold' : 'bg-slate-200 text-slate-700'}`}>PER</button>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <span className="bg-blue-50 text-blue-700 px-2 py-0.5 rounded uppercase font-medium">{f.type}</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 text-xs">
                                                        {f.type === 'sby' ? (
                                                            <label className="flex items-center space-x-2 cursor-pointer text-emerald-600 font-bold">
                                                                <input type="checkbox" checked={f.calledOut} onChange={() => toggleCallOut(f.id)} className="rounded text-emerald-600" />
                                                                <span>{t.callOutCheck}</span>
                                                            </label>
                                                        ) : !f.holiday ? (
                                                            <div className="space-y-1.5">
                                                                <label className="flex items-center space-x-2 cursor-pointer text-red-600 font-semibold">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={f.delay16h || false} 
                                                                        onChange={() => toggleDelay(f.id)} 
                                                                        className="rounded text-red-600" 
                                                                    />
                                                                    <span>{t.apply16hCheck}</span>
                                                                </label>
                                                                {f.delay16h && f.type === 'singapore' && (
                                                                    <select 
                                                                        value={f.delaySectorsCount || 1} 
                                                                        onChange={(e) => setDelaySectors(f.id, e.target.value)}
                                                                        className="bg-red-50 border border-red-200 text-red-800 font-bold text-[11px] py-1 px-2 rounded-lg outline-none w-full"
                                                                    >
                                                                        <option value="1">{t.oneSectorOpt}</option>
                                                                        <option value="2">{t.twoSectorsOpt}</option>
                                                                    </select>
                                                                )}
                                                            </div>
                                                        ) : null}
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        <button onClick={() => handleDeleteTrip(f.id)} className="text-red-500 hover:text-red-700 font-medium text-xs">{t.delete}</button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-800 mb-4">{t.deductionsBreakdown}</h3>
                                <ul className="space-y-3 text-sm text-slate-600">
                                    <li className="flex justify-between pb-2 border-b border-slate-100">
                                        <span>{t.tax}</span>
                                        <span className="font-semibold text-slate-800">£{estimatedTax.toFixed(2)}</span>
                                    </li>
                                    <li className="flex justify-between pb-2 border-b border-slate-100">
                                        <div>
                                            <span className="block font-medium">{t.ni}</span>
                                            <span className="text-[10px] text-slate-400">{t.niSub}</span>
                                        </div>
                                        <span className="font-semibold text-slate-800">£{estimatedNI.toFixed(2)}</span>
                                    </li>
                                    <li className="flex justify-between pb-2 border-b border-slate-100">
                                        <div>
                                            <span className="block font-medium">{t.pension}</span>
                                            <span className="text-[10px] text-slate-400">{t.pensionSub}</span>
                                        </div>
                                        <span className="font-semibold text-slate-800">£{estimatedPension.toFixed(2)}</span>
                                    </li>
                                </ul>
                            </div>
                            <div className="mt-6 pt-4 border-t border-slate-200 bg-slate-50 p-4 rounded-xl">
                                <div className="flex justify-between items-center text-sm font-bold text-slate-900">
                                    <span>{t.totalDeductions}</span>
                                    <span className="text-red-600">-£{totalDeductions.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
